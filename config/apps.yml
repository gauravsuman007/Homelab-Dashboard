    icon: jellyseerr
    category: Media
  audiobookshelf:
    name: Audiobookshelf
    icon: audiobookshelf
    category: Media
  stash:
    name: Stash
    icon: stash
    category: Media
  immich_server:
    name: Immich
    icon: immich
    category: Media

  # --- Automation ------------------------------------------------------
  radarr:
    name: Radarr
    icon: radarr
    category: Automation
  sonarr:
    name: Sonarr
    icon: sonarr
    category: Automation
  whisparr:
    name: Whisparr
    icon: whisparr
    category: Automation
  prowlarr:
    name: Prowlarr
    icon: prowlarr
    category: Automation
  riven:
    name: Riven API
    icon: riven
    category: Automation
  riven-frontend:
    name: Riven
    icon: riven
    category: Automation
  audiobookbay_downloader-jackett:
    name: Jackett
    icon: jackett
    category: Automation

  # --- Downloads -------------------------------------------------------
  rdtclient:
    name: RDT Client
    icon: rdt-client
    category: Downloads
  decypharr_torbox:
    name: Decypharr (TorBox)
    icon: decypharr
    category: Downloads
  decypharr_local:
    name: Decypharr (Local)
    icon: decypharr
    category: Downloads
  audiobookbay_downloader-audiobookbay-downloader:
    name: AudiobookBay
    icon: audiobookbay
    category: Downloads

  # --- Documents & Web -------------------------------------------------
  paperless-ngx:
    name: Paperless-ngx
    icon: paperless-ngx
    category: Documents
  wordpress_gaurav:
    name: WordPress
    icon: wordpress
    category: Documents

  # --- Projects --------------------------------------------------------
  zvg-scraper:
    name: ZVG Scraper
    icon: openproject
    category: Projects
  zvg-scraper-home:
    name: ZVG Scraper (Home)
    icon: openproject
    category: Projects

  # --- Infrastructure --------------------------------------------------
  docker-ui-portainer:
    name: Portainer
    icon: portainer
    category: Infrastructure
  nginx-proxy-manager-nginx:
    name: Nginx Proxy Manager
    icon: nginx-proxy-manager
    category: Infrastructure
    port: 81            # 80/443 are the proxy itself; 81 is the admin UI
  uptimeKuma:
    name: Uptime Kuma
    icon: uptime-kuma
    category: Infrastructure
  guacamole:
    name: Guacamole
    icon: apache-guacamole
    category: Infrastructure

  # --- Not currently running, listed so they are labelled correctly if
  #     they come back up (or if INCLUDE_STOPPED is enabled).
  metube:
    name: MeTube
    icon: metube
    category: Downloads
  jdownloader:
    name: JDownloader
    icon: jdownloader
    category: Downloads
  megabasterd-ng:
    name: MegaBasterd NG
    icon: mega
    category: Downloads
  pyload:
    name: pyLoad
    icon: pyload
