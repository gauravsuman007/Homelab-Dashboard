# OPTIONAL. Delete this file and the page still works.
#
# Everything a card needs is derived from the Docker daemon:
#
#   name      the image's org.opencontainers.image.title label, else the image
#             name, else the compose service name, else the container name.
#             Duplicates are disambiguated automatically, so two containers of
#             one image become "Decypharr (Local)" and "Decypharr (Torbox)".
#   icon      the image name, looked up in dashboard-icons; on a miss the
#             service's own favicon is used; on a second miss, a letter tile.
#   category  a built-in table of the common self-hosted apps (see
#             CATEGORY_RULES in app/discovery.py). Unmatched services land in
#             "Other".
#   port      the published port, ranked to prefer one the reverse proxy already
#             fronts. Host-network containers use the port their image declares
#             as exposed, and the reverse proxy itself links to its admin port
#             rather than the port it proxies for everything else.
#
# So this file is for correcting a guess, not for listing services. A new
# container appears on the page whether or not it is mentioned here. Everything
# below is cosmetic -- acronyms the deriver cannot know about, and one grouping
# that is a personal preference.
#
# Available keys, all optional, under `apps:` keyed by container name (or a
# prefix of it, which is handy for compose names carrying a project prefix and a
# scale suffix):
#
#   name / icon / category      override the derived value
#   port                        override the chosen host port
#   scheme                      http (default) or https
#   url                         a full LAN URL, replacing host:port entirely
#   hidden: true                drop the card
#
# Listing a container here also overrides the infrastructure denylist that
# normally keeps databases and sidecars off the page.
#
# `hide:` takes container names to drop unconditionally. This service hides
# itself automatically, so it does not need to be listed.

apps:
  # Acronyms and product styling the deriver has no way to know.
  wordpress_gaurav:
    name: WordPress
  rdtclient:
    name: RDT Client
  paperless-ngx:
    name: Paperless-ngx
  audiobookbay_downloader-audiobookbay-downloader:
    name: AudiobookBay
  # These two would auto-disambiguate to "(Local)" and "(Torbox)"; both are
  # pinned only to get TorBox's capitalisation right. Pinning one name takes it
  # out of the collision, so the pair has to be named together or not at all.
  decypharr_local:
    name: Decypharr (Local)
  decypharr_torbox:
    name: Decypharr (TorBox)

  # The two halves of Riven derive as "Riven" and "Riven Frontend"; the frontend
  # is the one worth clicking, so the names are swapped round by hand.
  riven:
    name: Riven API
  riven-frontend:
    name: Riven

  # A personal project with no favicon and no icon-set entry, and a grouping
  # that no built-in rule could guess.
  zvg-scraper:
    name: ZVG Scraper
    icon: openproject
    category: Projects
  zvg-scraper-home:
    name: ZVG Scraper (Home)
    icon: openproject
    category: Projects
