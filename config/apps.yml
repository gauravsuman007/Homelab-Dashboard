# Display overrides for the landing page. Everything here is optional --
# containers with a published port appear whether or not they are listed. This
# file only supplies what cannot be discovered, or what discovery gets ugly.
#
# Reloaded on every scan (default 30s), so edits appear without a restart.
#
# Per-container keys, under `apps:`. The key is the container name, or a prefix
# of it -- useful for compose-generated names that carry a project prefix and a
# numeric scale suffix, e.g. `audiobookbay_downloader-jackett` matches
# `audiobookbay_downloader-jackett-1`.
#
#   name:      card title                (default: prettified container name)
#   icon:      slug from dashboard-icons  (default: guessed from the image name)
#              https://github.com/homarr-labs/dashboard-icons -- try the
#              service's own name first; unknown slugs fall back to a letter
#              tile, they do not break the card. Riven, Decypharr and
#              AudiobookBay have no upstream icon as of Aug 2026 and are
#              deliberately left on their letter tiles -- drop a file into
#              cache/icons/<slug>.webp (or .svg) to supply one by hand; the
#              cache is only ever refilled for slugs with no file, and a
#              zero-byte file there is the "known missing" marker.
#   category:  section heading            (default: Other)
#   port:      host port of the web UI    (default: chosen from published ports)
#              REQUIRED for containers on the host network, which publish
#              nothing the Docker API can report.
#   scheme:    http | https               (default: http)
#   url:       full LAN URL, replacing host:port entirely
#   hidden:    true to drop the card even though it has a port
#
# A container listed here is shown even if its image is on the infrastructure
# denylist in discovery.py -- listing it is taken as "I mean this one".

defaults:
  category: Other

apps:
  # --- Media -----------------------------------------------------------
  jellyfin:
    name: Jellyfin
    icon: jellyfin
    category: Media
    port: 8096          # host-network container: not discoverable, must be set
  seerr:
